<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <title>Clock-Radio</title>
  </head>
  <body>
  <div class="container">
<body>
  <div class="container">
     
    

    <div class="clock-box">
      <div class="field">
        <label for="time">Time</label><br>
        <span class="time_disp" id="time">00:00</span>
        <span id="time_ampm">AM</span>
      </div>

      <div class="field">
        <label for="timezone">Timezone</label>
        <select id="timezone">
          <option value="Asia/Kolkata">Mumbai</option>
          <option value="America/Toronto">Toronto</option>
          <option value="Europe/London">London</option>
          <option value="Australia/Sydney">Sydney</option>
          <option value="Asia/Tokyo">Tokyo</option>
          <option value="America/Cancun">Cancun</option>
        </select>
      </div>

      <div class="button-row">
        <button id="setLT">Set LT</button>
        <button id="toggleFormat">Toggle 12/24h</button>
      </div>
    </div>

    

    <div class="world-clocks">
      <div><strong>Mumbai</strong><div id="clock-Mumbai">--:--:--</div></div>
      <div><strong>Toronto</strong><div id="clock-Toronto">--:--:--</div></div>
      <div><strong>London</strong><div id="clock-London">--:--:--</div></div>
      <div><strong>Sydney</strong><div id="clock-Sydney">--:--:--</div></div>
      <div><strong>Tokyo</strong><div id="clock-Tokyo">--:--:--</div></div>
      <div><strong>Cancun</strong><div id="clock-Cancun">--:--:--</div></div>
    </div>
  </div>
  <div class="left-panel">
      <button id="editButton">Edit</button>

  

   

      

      

      <h3>ALARM</h3>
      <div class="alarm-section">
        <input type="number" id="alarm_hour" placeholder="HOUR" disabled />
        <input type="number" id="alarm_minute" placeholder="MINUTE" disabled />
        <select id="alarm_ampm" disabled>
          <option>AM</option>
          <option>PM</option>
        </select>
      </div>

      <select id="snooze" disabled>
        <option value="5">5 min</option>
        <option value="5">6 min</option>
        <option value="10">7 min</option>
        <option value="15">9 min</option>
        <option value="10">10 min</option>
        <option value="5">11 min</option>
        <option value="10">13 min</option>
        <option value="15">14 min</option>
        <option value="15">15 min</option>
      </select>

      <div class="button-row">
        <button id="setAlarm" disabled>Set Alarm</button>
        <button id="cancelAlarm" disabled>Cancel Alarm</button>
      </div>  

    <div class="right-panel">
      <h2>Radio</h2>
      <select disabled><option>Option 1</option></select>
      <select disabled><option>Option 2</option></select>
      <select disabled><option>Option 3</option></select>

      <div class="choice">
        <h3>Now playing</h3>
        <span><button disabled id="choice1">1</button></span>
        <span><button disabled id="choice2">2</button></span>
        <span><button disabled id="choice3">3</button></span>
      </div>

      <button id="saveButton">Save</button>

      <div class="volume-control">
        <input type="range" id="volume" min="0" max="100">
        <label for="volume">Volume</label>
        <button id="muteButton">Mute</button>
      </div>
    </div>
  </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
  </body>
</html>
